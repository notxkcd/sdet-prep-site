<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42 Algorithms & 42 Data Structures</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
</head>
<body>
    <div class="screen">
        <header>
            <h1>42</h1>
            <p>Intuitive Explanations for Algorithms & Data Structures</p>
        </header>

        <main id="main-content">
            <div id="home-screen">
                <h2>Data Structures</h2>
                
                <h3>Fundamentals</h3>
                <ul id="ds-fundamentals-list">
                    <!-- Fundamental DS items will be injected here -->
                </ul>

                <h3>Specialized Data Structures</h3>
                <ul id="ds-specialized-list">
                    <!-- Specialized DS items will be injected here -->
                </ul>

                <h2>Algorithms</h2>
                <ul id="algo-list">
                    <!-- Algorithm items will be injected here by JS -->
                </ul>
            </div>

            <div id="content-screen" class="hidden">
                <button id="back-button">Back to List</button>
                <h2 id="content-title"></h2>
                <div id="content-explanation"></div>

                <h3>Implementation</h3>
                <div class="code-controls">
                    <select id="language-selector"></select>
                    <button id="copy-button">Copy</button>
                </div>
                <pre><code id="code-display" class="code-block language-python"></code></pre>

                <div id="content-expanded-explanation"></div>
                <div id="code-explanation"></div>
                <div id="application-content"></div>
            </div>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-d.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
