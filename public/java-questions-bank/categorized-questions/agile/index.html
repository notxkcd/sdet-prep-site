    <script>
        
        document.addEventListener("DOMContentLoaded", function() {
            const content = document.body;
            
            const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const nodesToReplace = [];
            while(node = walker.nextNode()) {
                if (node.nodeValue.includes("[-]")) nodesToReplace.push(node);
            }
            nodesToReplace.forEach(textNode => {
                const span = document.createElement('span');
                span.innerHTML = textNode.nodeValue.replace(/\[-\]/g, '<span class="started-icon" title="Started"></span>');
                textNode.parentNode.replaceChild(span, textNode);
            });
        });
    </script>

    <script>
        const body = document.getElementById('theme-body');
        const btn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        
        function updateButtonText() {
            if (body.classList.contains('theme-terminal')) {
                btn.textContent = "Light Mode";
            } else {
                btn.textContent = "Dark Mode";
            }
        }

        if (currentTheme === 'terminal') {
            body.classList.add('theme-terminal');
        }
        
        
        updateButtonText();

        btn.addEventListener('click', () => {
            body.classList.toggle('theme-terminal');
            updateButtonText();
            
            let theme = 'natural';
            if (body.classList.contains('theme-terminal')) {
                theme = 'terminal';
            }
            localStorage.setItem('theme', theme);
        });
    </script>
