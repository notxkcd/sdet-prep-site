{{ define "main" }}
<div class="panel" style="margin-bottom: 1rem; font-family: 'Courier New', monospace; font-size: 0.7rem; color: var(--dim);">
    [ SECTOR: {{ upper .Parent.Title }} ] [ NODE: {{ upper .Title }} ]
</div>

<article class="content-body">
    {{ .Content }}
</article>

<div class="navigation-cluster" style="margin-top: 3rem; display: flex; justify-content: space-between; gap: 1rem;">
    {{ if .PrevInSection }}
    <a href="{{ .PrevInSection.Permalink }}" class="nav-btn"><< PREV_NODE</a>
    {{ else }}
    <span></span>
    {{ end }}
    
    <a href="{{ .Parent.Permalink }}" class="nav-btn">[UP_TO_SECTOR]</a>

    {{ if .NextInSection }}
    <a href="{{ .NextInSection.Permalink }}" class="nav-btn">NEXT_NODE >></a>
    {{ else }}
    <span></span>
    {{ end }}
</div>
{{ end }}
